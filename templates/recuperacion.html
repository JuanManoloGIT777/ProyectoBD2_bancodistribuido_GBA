<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GBA CREDOMATIC | Recuperación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<section class="login-screen">
    <div class="login-card">

        <div class="login-brand">
            <div class="login-logo">GBA</div>
            <h2>Recuperar Acceso</h2>
            <p>Restablecimiento de contraseña</p>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }}">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('recuperacion') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario o correo electrónico</label>
                <input type="text" class="form-control" name="usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" name="nueva_clave" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar nueva contraseña</label>
                <input type="password" class="form-control" name="confirmar_clave" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Restablecer contraseña
            </button>
        </form>

        <div class="login-info text-center">
            <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none">Volver al login</a>
        </div>

    </div>
</section>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
