<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GBA CREDOMATIC | Registro Interno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<section class="login-screen">
    <div class="login-card">

        <div class="login-brand">
            <div class="login-logo">GBA</div>
            <h2>Registro Interno</h2>
            <p>Creación de usuarios autorizados</p>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }}">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('registro') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" name="nombre_completo" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre de usuario</label>
                <input type="text" class="form-control" name="usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" name="correo" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="clave" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" name="confirmar_clave" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" name="id_rol" required>
                    <option value="">Seleccione un rol</option>
                    {% for rol in roles %}
                        <option value="{{ rol.id_rol }}">{{ rol.nombre_rol }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Registrar usuario interno
            </button>
        </form>

        <div class="login-info text-center">
            <a href="{{ url_for('panel_admin') }}" class="fw-bold text-decoration-none">Regresar al panel administrativo</a>
        </div>

    </div>
</section>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
